name: Publish to TER

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_sqlite, simplexml, xml, zip
          tools: composer:v2
          coverage: none
      - name: Check tag and manifests
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          php -r '$c = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); exit(($c["extra"]["typo3/cms"]["version"] ?? "") === getenv("RELEASE_VERSION") ? 0 : 1);'
          php -r '$c = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); $_EXTKEY = $c["extra"]["typo3/cms"]["extension-key"]; include "ext_emconf.php"; exit(($EM_CONF[$_EXTKEY]["version"] ?? "") === getenv("RELEASE_VERSION") ? 0 : 1);'
      - name: Install and verify release source
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer validate --strict
          vendor/bin/phpcs --standard=phpcs.xml.dist
          vendor/bin/php-cs-fixer fix --dry-run --diff
          vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G
          vendor/bin/phpunit -c Build/phpunit/UnitTests.xml
          typo3DatabaseDriver=pdo_sqlite vendor/bin/phpunit -c Build/phpunit/FunctionalTests.xml
      - name: Publish numeric tag to TER
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test -n "$TYPO3_API_TOKEN"
          vendor/bin/tailor ter:publish "$RELEASE_VERSION" --comment="Release $RELEASE_VERSION"
