name: Extension CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, simplexml, xml, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer metadata and autoloading
        run: |
          composer validate --strict
          composer dump-autoload --optimize
      - name: Lint tracked PHP
        run: git ls-files -z '*.php' | xargs -0 -r -n1 php -l
      - name: Check PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: Check TYPO3 coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Analyze at PHPStan level 5
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G
      - name: Run unit tests
        run: vendor/bin/phpunit -c Build/phpunit/UnitTests.xml
      - name: Run functional tests with SQLite
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: vendor/bin/phpunit -c Build/phpunit/FunctionalTests.xml
      - name: Validate XLIFF XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          find Resources/Private/Language -name '*.xlf' -print0 | xargs -0 -r -n1 xmllint --noout
